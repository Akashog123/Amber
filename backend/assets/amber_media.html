<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amber</title>
<style>
  /* Rendered by Recall's bot as Amber's camera tile; its audio is Amber's voice in the call.
     - Meet crops this 1280x720 page to the middle of a tile (portrait in a grid): keep everything in a ~420px column.
     - The bot's browser has no emoji font (a "✋" showed as an empty box): icons are inline SVG.
     - It also has little CPU and no GPU: no animations, flat colors, so the audio never starves. */
  :root { --bg: #131c2e; --amber: #f5a524; --text: #f3f5f9; --muted: #9aa7bd; --hand: #fff4db; --hand-ink: #7a5600; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
  .stage { height: 100%; display: grid; place-items: center; }
  .card { width: 420px; text-align: center; }
  .avatar { width: 200px; height: 200px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center;
    background: var(--amber); color: var(--bg); font-size: 96px; font-weight: 700; border: 10px solid transparent; }
  .avatar svg { display: none; width: 120px; height: 120px; }
  body.speaking .avatar { border-color: #ffd58a; }
  h1 { margin: 22px 0 4px; font-size: 52px; }
  .status { font-size: 26px; color: var(--muted); }
  .hand { display: none; margin: 18px auto 0; padding: 12px 16px; border-radius: 16px; background: var(--hand);
    color: var(--hand-ink); font-size: 24px; font-weight: 700; line-height: 1.3; }
  /* Recall can't raise a real Meet hand, so the whole tile becomes one: hard to miss in a grid of faces. */
  body.hand-up { background: #3d2e0c; }
  body.hand-up .avatar { background: var(--hand); color: var(--hand-ink); font-size: 0; }
  body.hand-up .avatar svg { display: block; }
  body.hand-up .hand { display: block; }
  .offline { position: absolute; bottom: 24px; width: 100%; text-align: center; color: #c97a7a; font-size: 18px; }
</style>
</head>
<body>
<div class="stage"><div class="card">
  <div class="avatar">A<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/>
    <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
  </svg></div>
  <h1>Amber</h1>
  <div class="status" id="status">Listening</div>
  <div class="hand">Question about a record.<br>Say “Amber, go ahead”</div>
</div></div>
<div class="offline" id="offline"></div>
<script>
  const params = new URLSearchParams(location.search);
  const RATE = 16000;
  // Jitter buffer, seconds: starts small (fast first word) and doubles after each underrun, up to MAX_LEAD, so a
  // bursty stream settles after one hiccup instead of stuttering all the way through. ?lead= sets the start.
  let lead = Number(params.get("lead") || 0.3);
  const MAX_LEAD = 1.5;
  // "playback": the browser's larger, glitch-resistant output buffers (the bot's machine is small, no GPU).
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE, latencyHint: "playback" });
  let sock = null;
  let fresh = true;          // next chunk starts a new utterance ("begin"): a gap before it is not an underrun
  let playhead = 0;          // when the next chunk starts, in ctx time
  let sources = [];          // scheduled chunks, so "stop" can cut them all
  let leftover = new Uint8Array(0);  // an odd trailing byte from a chunk boundary
  const statusEl = document.getElementById("status");
  window.amberStats = { chunks: 0, seconds: 0, stops: 0, underruns: 0, connected: false };  // read by the backend's UI check

  function setSpeaking(on) {
    document.body.classList.toggle("speaking", on);
    statusEl.textContent = on ? "Speaking" : document.body.classList.contains("hand-up") ? "Hand raised" : "Listening";
  }

  function play(bytes) {
    ctx.resume();
    const joined = new Uint8Array(leftover.length + bytes.length);
    joined.set(leftover); joined.set(bytes, leftover.length);
    const usable = joined.length - (joined.length % 2);
    leftover = joined.slice(usable);
    if (!usable) return;
    const pcm = new Int16Array(joined.buffer, 0, usable / 2);
    const buf = ctx.createBuffer(1, pcm.length, RATE);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    // Chunks arrive unevenly (ElevenLabs -> backend -> tunnel -> this page). Played the moment they land, every
    // late one leaves a gap: she stutters. After running dry, buffer LEAD seconds before playing again.
    const now = ctx.currentTime;
    if (playhead < now + 0.02) {
      // Ran dry mid-speech (the last chunk ended under 2 s ago): an underrun, i.e. an audible gap. Tell the
      // backend (it logs why) and buffer more from now on.
      if (!fresh && playhead > 0 && now - playhead < 2) {
        amberStats.underruns += 1;
        if (sock && sock.readyState === 1) sock.send(JSON.stringify({ type: "underrun", late: +(now - playhead).toFixed(3), lead }));
        lead = Math.min(lead * 2, MAX_LEAD);
      }
      playhead = now + lead;
    }
    fresh = false;
    src.start(playhead);
    playhead += buf.duration;
    sources.push(src);
    amberStats.chunks += 1; amberStats.seconds += buf.duration;
    setSpeaking(true);
    src.onended = () => {
      sources = sources.filter((s) => s !== src);
      if (!sources.length) setSpeaking(false);
    };
  }

  function stop() {
    for (const s of sources) { try { s.stop(); } catch (e) {} }
    sources = []; leftover = new Uint8Array(0); playhead = 0;
    amberStats.stops += 1;
    setSpeaking(false);
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = sock = new WebSocket(`${proto}://${location.host}/ws/media?m=${params.get("m")}&token=${params.get("token") || ""}`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => { document.getElementById("offline").textContent = ""; amberStats.connected = true; };
    ws.onmessage = (e) => {
      if (typeof e.data !== "string") return play(new Uint8Array(e.data));
      const msg = JSON.parse(e.data);
      if (msg.type === "stop") stop();
      if (msg.type === "begin") fresh = true;
      if (msg.type === "hand") {
        document.body.classList.toggle("hand-up", !!msg.on);
        if (!sources.length) statusEl.textContent = msg.on ? "Hand raised" : "Listening";
      }
      if (msg.type === "status") statusEl.textContent = msg.text;
    };
    ws.onclose = () => {  // backend restarted / tunnel blip: keep trying, Amber stays in the call
      document.getElementById("offline").textContent = "reconnecting…";
      setTimeout(connect, 1000);
    };
  }
  connect();
</script>
</body>
</html>
